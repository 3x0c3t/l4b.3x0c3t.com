<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="led-display">
            <div class="led"></div>
            <div class="led"></div>
            <div class="led"></div>
        </div>
        <div class="controls">
            <div class="color-pickers">
                <div class="color-picker-container">
                    <label for="colorPicker1">Couleur1:</label>
                    <input id="colorPicker1" type="color" class="color-picker">
                </div>
                <div class="color-picker-container">
                    <label for="colorPicker2">Couleur2:</label>
                    <input id="colorPicker2" type="color" class="color-picker">
                </div>
            </div>
            <div class="modes">
                <button id="modeNormal">Normal</button>
                <button id="modePolice">Police</button>
                <button id="modeRainbow">Rainbow</button>
                <button id="modeStrobe">Strobe</button>
                <button id="modeSOS">SOS</button> <!-- Added SOS Mode Button -->
            </div>
            <div class="intensity">
                <label for="intensityRange">Intensity:</label>
                <input id="intensityRange" type="range" min="0" max="100" value="50">
                <span id="intensityValue">50</span>
            </div>
            <div class="tempo">
                <div class="tempo-control">
                    <label for="tempoPolice">Tempo Police:</label>
                    <input id="tempoPolice" type="range" min="100" max="2000" value="500">
                    <span id="tempoPoliceValue">500 ms</span>
                </div>
                <div class="tempo-control">
                    <label for="tempoRainbow">Tempo Rainbow:</label>
                    <input id="tempoRainbow" type="range" min="100" max="2000" value="200">
                    <span id="tempoRainbowValue">200 ms</span>
                </div>
                <div class="tempo-control">
                    <label for="tempoStrobe">Tempo Strobe:</label>
                    <input id="tempoStrobe" type="range" min="100" max="2000" value="300">
                    <span id="tempoStrobeValue">300 ms</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
