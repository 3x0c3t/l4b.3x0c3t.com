<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Dégradé</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="dynamic-header">
        <h1>TEMPLATE Generator V1.0 - 20241025-12:05:00</h1>
        <div id="header-subblocks" class="subblocks-container"></div>
    </header>

    <main>
        <div class="container">
            <!-- Bloc Gauche : Sélection des couleurs -->
            <div class="bloc" id="left-bloc">
                <h2>Options</h2>

                <h2>Configuration du Header</h2>
                <label for="num-sub-blocs">Nombre de sous-blocs :</label>
                <br>
                <select id="num-sub-blocs">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
                
                <!-- Configuration des couleurs et angles pour le header -->
                <label for="header-color1">Couleur 1:</label>
                <input type="color" id="header-color1" value="#FF5733">
                <label for="header-color2">Couleur 2:</label>
                <input type="color" id="header-color2" value="#33C1FF">
                <label for="header-angle">Angle du dégradé :</label>
                <input type="range" id="header-angle" min="0" max="360" value="90">
                <span id="header-angle-value">90°</span>
                <label for="header-radial">Dégradé radial :</label>
                <input type="checkbox" id="header-radial">

                <h2>Configuration du Body</h2>
                <label for="body-color1">Couleur 1:</label>
                <input type="color" id="body-color1" value="#FF5733">
                <label for="body-color2">Couleur 2:</label>
                <input type="color" id="body-color2" value="#33C1FF">
                <label for="body-angle">Angle du dégradé :</label>
                <input type="range" id="body-angle" min="0" max="360" value="90">
                <span id="body-angle-value">90°</span>
                <label for="body-radial">Dégradé radial :</label>
                <input type="checkbox" id="body-radial">

                <h2>Configuration du Footer</h2>
                <label for="footer-color1">Couleur 1:</label>
                <input type="color" id="footer-color1" value="#FF5733">
                <label for="footer-color2">Couleur 2:</label>
                <input type="color" id="footer-color2" value="#33C1FF">
                <label for="footer-angle">Angle du dégradé :</label>
                <input type="range" id="footer-angle" min="0" max="360" value="90">
                <span id="footer-angle-value">90°</span>
                <label for="footer-radial">Dégradé radial :</label>
                <input type="checkbox" id="footer-radial">
            </div>

            <!-- Bloc Centre : Prévisualisation -->
            <div class="bloc" id="center-bloc">
                <h2>Prévisualisation</h2>
                <div id="preview"></div>
            </div>

            <!-- Bloc Droit : Informations additionnelles -->
            <div class="bloc" id="right-bloc">
                <h2>Export du code HTML/CSS</h2>
                <p>Utilisez les sélecteurs pour choisir les couleurs et configurer le dégradé.</p>
            </div>
        </div>
    </main>

    <footer id="dynamic-footer">
        <div id="footer-subblocks" class="subblocks-container"></div>
        <a href="https://www.3x0c3t.com" target="_blank">-3xØc3t-</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
