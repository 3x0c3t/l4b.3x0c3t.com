<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Buttons Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <h1>Button Effects</h1>
        <nav>
            <a href="https://l4b.3x0c3t.com/html_links_generator.html">-3xØc3t- L4B</a> |
            <a href="https://3x0c3t.com/">-3xØc3t.com-</a>
        </nav>
    </header>

    <!-- Main Content -->
    <div class="container">
        <!-- Bloc gauche : boutons -->
        <div class="left-block">
            Cliquer sur un bouton pour afficher son code html et css
            <br><br>
            <button class="btn btn-hover-1" onclick="showCode('button1')">Bouton 1</button>
            <button class="btn btn-hover-2" onclick="showCode('button2')">Bouton 2</button>
            <button class="btn btn-hover-3" onclick="showCode('button3')">Bouton 3</button>
            <button class="btn btn-hover-4" onclick="showCode('button4')">Bouton 4</button>
            <button class="btn btn-hover-5" onclick="showCode('button5')">Bouton 5</button>
            <button class="btn btn-hover-6" onclick="showCode('button6')">Bouton 6</button>
            <button class="btn btn-hover-7" onclick="showCode('button7')">Bouton 7</button>
            <button class="btn btn-hover-8" onclick="showCode('button8')">Bouton 8</button>
            <button class="btn btn-hover-9" onclick="showCode('button9')">Bouton 9</button>
            <button class="btn btn-hover-10" onclick="showCode('button10')">Bouton 10</button>
        </div>

        <!-- Bloc central : HTML du bouton -->
        <div class="center-block">
            <h2>Code HTML</h2>
            <pre id="htmlCode"></pre>
        </div>

        <!-- Bloc droit : CSS du bouton -->
        <div class="right-block">
            <h2>Code CSS</h2>
            <pre id="cssCode"></pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
