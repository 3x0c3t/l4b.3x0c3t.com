<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <nav>
            <ul>
                <li><a href="https://l4b.3x0c3t.com/html_links_generator.html">Accueil</a></li>
                <li><a href="https://l4b.3x0c3t.com/L4B/07_CV/index.html">CV</a></li>
                <li><a href="https://www.linkedin.com/in/julien-calonne-548a33177/">Linkedin</a></li>
                <!-- Ajoutez d'autres liens ici -->
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="title">
            <h1>-QR Code Generator-</h1>
            <h3>v1.3.1 - 20240722</h3>
            <h2>-3xØc3t-</h2>
        </div>
        <input type="text" id="text" placeholder="Entrer votre TEXTE pour générer le QR code"><br>
        
        <!-- Grouping the color labels and inputs -->
        <div class="color-options">
            <label for="colorDark">QR COLOR:</label>
            <input type="color" id="colorDark" value="#000000">
            <label for="colorLight">BACKGROUND COLOR:</label>
            <input type="color" id="colorLight" value="#ffffff">
        </div>

        <label for="transparentBackground">Transparent Background:</label>
        <input type="checkbox" id="transparentBackground"><br>
        <label for="dotStyle">Dot Style:</label>
        <select id="dotStyle">
            <option value="dots">Dots</option>
            <option value="rounded">Rounded</option>
            <option value="classy">Classy</option>
            <option value="classy-rounded">Classy Rounded</option>
            <option value="square">Square</option>
            <option value="extra-rounded">Extra Rounded</option>
        </select><br>
        <label for="logo">Logo (URL):</label>
        <input type="text" id="logo" placeholder="URL de votre logo"><br>
        <div id="qrcode"></div>
        <button id="downloadBtn" style="display:none;">Download QR Code</button>

    </div>
    <script src="libs/qr-code-styling.min.js"></script>
    <script src="script.js"></script>
</body>
