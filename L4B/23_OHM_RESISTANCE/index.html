<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de Résistance Ohmique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculateur de Résistance Ohmique</h1>
        <label for="band-count">Nombre de bandes :</label>
        <select id="band-count">
            <option value="3">3 bandes</option>
            <option value="4">4 bandes</option>
            <option value="5">5 bandes</option>
        </select>
        <div id="band-container"></div>
        <div class="result">
            <p>Valeur de la résistance : <span id="resistance-value">0</span> Ω</p>
            <p>Avec une tolérance de : <span id="tolerance-value">±20%</span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
