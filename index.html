<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#02070b">
    <title>L4B // 3x0c3t</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div id="app">

    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">L4B</span>
            <span class="brand-sub">// 3x0c3t LABORATORY</span>
        </div>

        <div class="system-status">
            <span class="status-dot"></span>
            <span>SYSTEM ONLINE</span>
            <span id="clock">00:00:00</span>
        </div>
    </header>

    <main class="lab">

        <section class="module module-web" data-module="WEB">
            <div class="module-index">01</div>
            <div class="module-title">WEB</div>
            <div class="module-line"></div>
            <div class="module-status">ACCESS</div>
        </section>

        <section class="module module-code" data-module="CODE">
            <div class="module-index">02</div>
            <div class="module-title">CODE</div>
            <div class="module-line"></div>
            <div class="module-status">SOURCE</div>
        </section>

        <section class="module module-design" data-module="DESIGN">
            <div class="module-index">03</div>
            <div class="module-title">DESIGN</div>
            <div class="module-line"></div>
            <div class="module-status">VISUAL</div>
        </section>

        <section class="module module-hardware" data-module="HARDWARE">
            <div class="module-index">04</div>
            <div class="module-title">HARDWARE</div>
            <div class="module-line"></div>
            <div class="module-status">SIGNAL</div>
        </section>

        <section class="module module-games" data-module="GAMES">
            <div class="module-index">05</div>
            <div class="module-title">GAMES</div>
            <div class="module-line"></div>
            <div class="module-status">PLAY</div>
        </section>

        <section class="module module-media" data-module="MEDIA">
            <div class="module-index">06</div>
            <div class="module-title">MEDIA</div>
            <div class="module-line"></div>
            <div class="module-status">ARCHIVE</div>
        </section>

        <section class="core">

            <div class="core-label top-label">
                <span>SUBLIMINAL</span>
                <span id="signalState">SIGNAL</span>
            </div>

            <div class="crt-shell">

                <div class="crt-frame">

                    <div class="crt-screen" id="crtScreen">

                        <div class="crt-image" id="crtImage"></div>

                        <div class="crt-noise"></div>
                        <div class="crt-scanlines"></div>
                        <div class="crt-vignette"></div>
                        <div class="crt-glare"></div>

                        <div class="crt-ui">
                            <span id="frameNumber">FRAME 000</span>
                            <span id="frameMessage">NO SIGNAL</span>
                        </div>

                    </div>

                </div>

                <div class="crt-controls">
                    <span class="crt-led"></span>
                    <span>CRT-03</span>
                    <span class="control-separator">/</span>
                    <span id="frequency">00.00 Hz</span>
                </div>

            </div>

            <div class="core-label bottom-label">
                <span>L4B CORE</span>
                <span id="coreReadout">WAITING</span>
            </div>

        </section>

        <div class="crosshair crosshair-tl"></div>
        <div class="crosshair crosshair-tr"></div>
        <div class="crosshair crosshair-bl"></div>
        <div class="crosshair crosshair-br"></div>

        <div class="readout readout-left">
            <span>SYS</span>
            <strong id="cpuValue">00%</strong>
        </div>

        <div class="readout readout-right">
            <span>MEM</span>
            <strong id="memValue">000</strong>
        </div>

    </main>

    <footer class="footer">

        <div>
            <span>L4B // DIGITAL LABORATORY</span>
        </div>

        <div>
            <span id="screenInfo">SCREEN 0000×0000</span>
        </div>

        <div>
            <span>3X0C3T © <span id="year"></span></span>
        </div>

    </footer>

</div>

<script src="index.js"></script>
</body>
</html>
